# IMPORTANT: pinned so the project name (and therefore the named volumes) does
# not depend on the checkout directory's name, which differs per machine.
name: portfolio

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 12
  resume-cache-init:
    image: mcr.microsoft.com/dotnet/sdk@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80
    user: "0:0"
    volumes:
      - resume-pdf-cache:/data/resume-cache
    command: sh -lc 'mkdir -p /data/resume-cache && chown -R ${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000} /data/resume-cache'
    restart: "no"
  nuget-cache-init:
    image: mcr.microsoft.com/dotnet/sdk@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80
    user: "0:0"
    volumes:
      - nuget-cache:/tmp/nuget-packages
    command: sh -lc 'mkdir -p /tmp/nuget-packages && chown -R ${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000} /tmp/nuget-packages'
    restart: "no"
  web: &sdk
    image: mcr.microsoft.com/dotnet/sdk@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80
    user: "${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /src
    volumes:
      - ..:/src
      - type: bind
        source: ${PORTFOLIO_PUBLIC_ASSET_PATH:-../data/public}
        target: /data/public
        read_only: true
        bind:
          create_host_path: false
      - resume-pdf-cache:/data/resume-cache
      - nuget-cache:/tmp/nuget-packages
    tmpfs:
      - /tmp:uid=${PORTFOLIO_CONTAINER_UID:-1000},gid=${PORTFOLIO_CONTAINER_GID:-1000},mode=1777
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      PORTFOLIO_DB_CONNECTION: Host=postgres;Database=portfolio;Username=portfolio;Password=portfolio
      PORTFOLIO_TEST_PG_CONNECTION: Host=postgres;Database=postgres;Username=portfolio;Password=portfolio
      PORTFOLIO_PUBLIC_ASSET_ROOT: /data/public
      PORTFOLIO_RESUME_PDF_ROOT: /data/resume-cache
      TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
      TECTONIC_ONLY_CACHED: "true"
      HOME: /data/resume-cache
      XDG_CACHE_HOME: /data/resume-cache/.cache
      PUBLIC_SITE_BASE_URL: http://localhost:8080
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget-packages
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    command: sh ./tools/scripts/run-with-tectonic.sh
    depends_on:
      postgres:
        condition: service_healthy
      resume-cache-init:
        condition: service_completed_successfully
      nuget-cache-init:
        condition: service_completed_successfully
  stories:
    <<: *sdk
    profiles:
      - tools
    ports: []
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8081
      PORTFOLIO_DB_CONNECTION: Host=postgres;Database=portfolio;Username=portfolio;Password=portfolio
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget-packages
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/index.html >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 900
      start_period: 5s
    command: dotnet run --project src/Portfolio/Portfolio.Blazor.Stories/Portfolio.Blazor.Stories.csproj --configuration Release --no-build --urls http://0.0.0.0:8081

volumes:
  postgres-data:
  nuget-cache:
  resume-pdf-cache:
