id: no-generic-props-type-name-tsx
language: Tsx
severity: error
message: Component prop contracts must use a specific Props name.
files:
  - src/**/*.tsx
ignores:
  - src/routeTree.gen.ts
  - src/data/api/generated/**
rule:
  any:
    - pattern: 'type Props = $$$VALUE'
    - pattern: 'type ComponentProps = $$$VALUE'
    - pattern: 'type Tipagem = $$$VALUE'
