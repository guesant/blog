name: blazor-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-quality:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: .docker/compose.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run the compose services as the runner user
        run: |
          echo "PORTFOLIO_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Create isolated CI content placeholder
        run: mkdir -p data/public

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends just

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Restore locked NuGet dependencies
        run: docker compose run --rm web dotnet restore src/Blog.Blazor.slnx --locked-mode

      - name: Run the quality gate
        run: just check

      - name: Apply PostgreSQL migrations
        run: docker compose run --rm web sh -lc 'dotnet tool restore >/dev/null && dotnet tool run dotnet-ef database update --project src/Blog/Blog.Blazor.Database/Blog.Blazor.Database.csproj --startup-project src/Blog/Blog.Blazor.Database/Blog.Blazor.Database.csproj --context BlogAdminDbContext --configuration Release --no-build'

      - name: Audit NuGet dependencies
        run: docker compose run --rm web sh -lc 'set -e; for project in src/Blog/*/*.csproj; do dotnet list "$project" package --vulnerable --include-transitive; done'

      - name: Generate NuGet SPDX SBOM
        run: docker compose run --rm web sh -lc 'set -e; mkdir -p /tmp/blazor-sbom /src/artifacts/sbom; for project in src/Blog/*/*.csproj; do dotnet list "$project" package --include-transitive --format json > "/tmp/blazor-sbom/$(basename "$project" .csproj).json"; done; dotnet run --project src/Blog/Blog.Blazor.Sbom/Blog.Blazor.Sbom.csproj --no-restore -- /tmp/blazor-sbom /src/artifacts/sbom/dependencies.spdx.json && test -s /src/artifacts/sbom/dependencies.spdx.json'

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blazor-nuget-sbom
          path: artifacts/sbom/dependencies.spdx.json
          if-no-files-found: error

      - name: Start SSR app for structural smoke tests
        run: docker compose up -d web

      # IMPORTANT: `dotnet run` compiles the app on first start, so readiness takes minutes
      # here, not the seconds the default 30 attempts allow.
      - name: Verify public route shells without production data
        run: docker compose exec -T -e ROUTE_SHELL_READY_ATTEMPTS=600 web sh tools/scripts/verify-route-shell.sh

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 web postgres
