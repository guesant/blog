id: no-complex-parameter-type-tsx
language: Tsx
severity: error
message: Extraia o tipo complexo do parâmetro para um type ou interface nomeado.

rule:
  all:
    - any:
        - kind: function_type
        - kind: tuple_type
        - kind: conditional_type
    - inside:
        any:
          - kind: required_parameter
          - kind: optional_parameter
        stopBy: end
