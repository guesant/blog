name: quality

on:
  push:
    paths-ignore:
      - .deploy/**
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - .deploy/**
      - docs/**
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends just

      - name: Run the repository gate
        run: PORTFOLIO_CONTAINER_UID="$(id -u)" PORTFOLIO_CONTAINER_GID="$(id -g)" just check
