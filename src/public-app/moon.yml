$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
layer: application
tags: [tanstack-start, app]
toolchains:
  default: node

tasks:
  build:
    command: 'pnpm build'
    inputs:
      - 'src/**/*'
      - 'src/components/**/*'
      - 'src/data/**/*'
      - 'src/i18n/**/*'
      - 'public/**/*'
      - 'src/app/**/*'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '/biome.json'
      - '/.config/moon/**/*.yml'
    outputs:
      - 'dist/**/*'
    tags: [build]
  discover-routes:
    command: 'node scripts/ci/discover-routes.mts'
    inputs: ['src/**/*', 'scripts/ci/discover-routes.mts']
    outputs: ['scripts/ci/audited-routes.json']
    tags: [generate]
  dev:
    command: 'pnpm dev -- --host 0.0.0.0'
    preset: server
    options:
      persistent: true
    tags: [dev]
  start:
    command: 'pnpm start'
    preset: server
    options:
      persistent: true
    deps: [build]
    tags: [serve]
