services:
  web:
    environment:
      PORTFOLIO_WATCH: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      # /tmp/nuget-packages is baked read-only into the image for the
      # originally-vendored packages; anything added later (e.g. via
      # `dotnet add package`) needs a writable cache instead.
      NUGET_PACKAGES: "/src/.nuget-cache"
      # Overridable from a .env file at the repo root (Docker Compose only
      # auto-loads a file literally named .env, never .env.local) so a real
      # Google OAuth client can be tested in dev; falls back to a
      # non-empty placeholder otherwise, since Program.cs registers the
      # Google auth scheme whenever these are non-empty and an empty
      # ClientId throws on every request rather than just on login.
      PORTFOLIO_ADMIN_GOOGLE_CLIENT_ID: "${PORTFOLIO_ADMIN_GOOGLE_CLIENT_ID:-dev-placeholder}"
      PORTFOLIO_ADMIN_GOOGLE_CLIENT_SECRET: "${PORTFOLIO_ADMIN_GOOGLE_CLIENT_SECRET:-dev-placeholder}"
      PORTFOLIO_ADMIN_GOOGLE_EMAIL: "${PORTFOLIO_ADMIN_GOOGLE_EMAIL:-}"
    command: sh -lc 'dotnet restore src/Portfolio.Blazor.slnx --locked-mode && exec sh ./tools/scripts/run-with-tectonic.sh'
