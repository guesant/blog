$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
layer: tool
tags: [pdf]
dependsOn: [content]
env:
  PORTFOLIO_PDF_COMPILER: '../../tools/pdf/compile.sh'
toolchains:
  default: node

tasks:
  test:
    command: 'node --test test/**/*.test.ts'
    inputs: ['src/**/*', 'test/**/*', 'templates/**/*', 'package.json', 'tsconfig.json']
    tags: [test, check]
  generate:
    command: 'node src/generate.mts --output-dir ../next-app/public'
    inputs: ['src/**/*', 'templates/**/*', 'package.json', 'tsconfig.json', '/tools/pdf/compile.sh', '/packages/content/content/**/*']
    outputs: ['/packages/next-app/public/resume-*.pdf', '/packages/next-app/public/resume-*.tex']
    options:
      cache: true
    tags: [build, generate]
  dev:
    command: 'node src/generate.mts --watch --output-dir ../next-app/public'
    preset: server
    options:
      persistent: true
    tags: [dev]
  cms:
    extends: dev
    tags: [dev]
