name: codeql

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy/**
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - deploy/**
      - docs/**
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: src/global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: csharp

      - name: Restore locked NuGet dependencies
        run: dotnet restore src/Blog.Blazor.slnx --locked-mode

      - name: Build
        run: dotnet build src/Blog.Blazor.slnx --configuration Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:csharp
