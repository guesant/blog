services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    # The image carries the production bootstrap entrypoint. Development must
    # not back up, migrate, cache, or otherwise mutate the persistent database
    # merely because the app container is restarted.
    entrypoint: []
    working_dir: /app
    volumes:
      - .:/app
      - laravel-vendor:/app/vendor
      - composer-cache:/composer-cache
      - tectonic-cache:/root/.cache/tectonic
      - portfolio-resume-pdf-cache:/data/resume-cache:ro
    networks:
      - default
      - portfolio
    environment:
      COMPOSER_CACHE_DIR: /composer-cache
      APP_CONFIG_CACHE: /tmp/portfolio-dev-config.php
      TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: frankenphp php-server --root=/app/public --listen=:8000

volumes:
  composer-cache:
  laravel-vendor:
  tectonic-cache:
  portfolio-resume-pdf-cache:
    external: true
    name: portfolio_resume-pdf-cache

networks:
  portfolio:
    external: true
    name: portfolio_default
