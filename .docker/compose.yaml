# IMPORTANT: pinned so the project name (and therefore the named volumes) does
# not depend on the checkout directory's name, which differs per machine.
name: portfolio

x-node-image: &node-image
  build:
    context: ..
    dockerfile: .docker/node.Dockerfile
  image: portfolio-node

services:
  postgres:
    build:
      context: ..
      dockerfile: .docker/postgres.Dockerfile
    image: portfolio-postgres
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 12
  laravel: &laravel
    build:
      context: ../src/laravel
      dockerfile: docker/app.Dockerfile
    working_dir: /app
    volumes:
      - ../src/laravel:/app
      - laravel-vendor:/app/vendor
      - resume-pdf-cache:/data/resume-cache:ro
      - laravel-composer-cache:/composer-cache
    environment:
      APP_ENV: local
      APP_KEY: ${PORTFOLIO_LARAVEL_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: portfolio
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      COMPOSER_CACHE_DIR: /composer-cache
      PORTFOLIO_RESUME_PDF_ROOT: /data/resume-cache
      TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: frankenphp php-server --root=/app/public --listen=:8000
    depends_on:
      postgres:
        condition: service_healthy
  laravel-worker:
    <<: *laravel
    ports: []
    command: php artisan queue:work --queue=default,open-graph --sleep=3 --tries=3 --max-time=3600
  laravel-scheduler:
    <<: *laravel
    ports: []
    command: php artisan schedule:work
  start:
    <<: *node-image
    working_dir: /workspace/src/public-app
    user: "${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000}"
    volumes:
      - ..:/workspace
      - start-node-modules:/workspace/src/public-app/node_modules
    environment:
      PORTFOLIO_CONTENT_API_URL: http://laravel:8000/api/v1/public-site
      PORTFOLIO_PUBLIC_API_URL: /api/v1
      SITE_URL: http://localhost:3000
      HOME: /tmp
    ports:
      - "3000:3000"
    command: sh -lc 'corepack pnpm install --frozen-lockfile --ignore-scripts && corepack pnpm dev -- --host 0.0.0.0'
    depends_on:
      laravel:
        condition: service_started
      start-node-modules-init:
        condition: service_completed_successfully
  start-node-modules-init:
    <<: *node-image
    user: "0:0"
    volumes:
      - start-node-modules:/workspace/src/public-app/node_modules
    command: >-
      sh -lc 'mkdir -p /workspace/src/public-app/node_modules && chown -R
      ${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000}
      /workspace/src/public-app/node_modules'
    restart: "no"
  lighthouse:
    build:
      context: ..
      dockerfile: .docker/lighthouse.Dockerfile
    image: portfolio-lighthouse
    working_dir: /workspace/src/public-app
    volumes:
      - ..:/workspace
      - start-node-modules:/workspace/src/public-app/node_modules
    environment:
      HOME: /tmp
      CHROME_PATH: /usr/bin/chromium
      PORTFOLIO_CONTENT_API_URL: http://laravel:8000/api/v1/public-site
      PORTFOLIO_PUBLIC_API_URL: /api/v1
      SITE_URL: http://127.0.0.1:3000
    depends_on:
      laravel:
        condition: service_started
      start-node-modules-init:
        condition: service_completed_successfully
  resume-cache-init:
    <<: *node-image
    user: "0:0"
    volumes:
      - resume-pdf-cache:/data/resume-cache
    command: >-
      sh -lc 'mkdir -p /data/resume-cache && chown -R
      ${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000}
      /data/resume-cache'
    restart: "no"
volumes:
  postgres-data:
  resume-pdf-cache:
  laravel-composer-cache:
  laravel-vendor:
  start-node-modules:
