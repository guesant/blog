apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/guesant/blog:sha-0000000000000000000000000000000000000000
          command:
            - /bin/sh
            - -c
            - |
              export PORTFOLIO_DB_CONNECTION="Host=$(cat /secrets/db/host);Database=$(cat /secrets/db/dbname);Username=$(cat /secrets/db/user);Password=$(cat /secrets/db/password)"
              exec /app/entrypoint.prod.sh
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: db-credentials
              mountPath: /secrets/db
              readOnly: true
            - name: public-assets
              mountPath: /data/public
            - name: resume-cache
              mountPath: /data/resume-cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: db-credentials
          secret:
            secretName: postgres-app
        - name: public-assets
          emptyDir: {}
        - name: resume-cache
          emptyDir: {}
