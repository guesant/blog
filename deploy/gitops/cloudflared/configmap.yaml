apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    tunnel: REPLACE_WITH_TUNNEL_ID
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: blog.example.invalid
        service: http://app.blog.svc.cluster.local
      - service: http_status:404
