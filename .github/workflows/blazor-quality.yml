name: blazor-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run the compose services as the runner user
        run: |
          echo "PORTFOLIO_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Create isolated CI content placeholder
        run: >-
          docker run --rm --network none
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/src"
          --workdir /src
          mcr.microsoft.com/dotnet/sdk@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80
          sh -lc 'mkdir -p data/public && : > data/portfolio.sqlite'

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends just

      - name: Restore locked NuGet dependencies
        run: docker compose run --rm web dotnet restore src/Portfolio.Blazor.slnx --locked-mode

      - name: Run the quality gate
        run: just check

      # IMPORTANT: the solution also holds JavaScript projects (*.esproj) that `dotnet list package`
      # rejects, so the audit and the SBOM walk the C# projects one by one.
      - name: Audit NuGet dependencies
        run: docker compose run --rm web sh -lc 'set -e; for project in src/Portfolio/*/*.csproj; do dotnet list "$project" package --vulnerable --include-transitive; done'

      - name: Generate NuGet SPDX SBOM
        run: docker compose run --rm web sh -lc 'set -e; mkdir -p /tmp/blazor-sbom /src/artifacts/sbom; for project in src/Portfolio/*/*.csproj; do dotnet list "$project" package --include-transitive --format json > "/tmp/blazor-sbom/$(basename "$project" .csproj).json"; done; dotnet run --project src/Portfolio/Portfolio.Blazor.Sbom/Portfolio.Blazor.Sbom.csproj --no-restore -- /tmp/blazor-sbom /src/artifacts/sbom/dependencies.spdx.json && test -s /src/artifacts/sbom/dependencies.spdx.json'

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blazor-nuget-sbom
          path: artifacts/sbom/dependencies.spdx.json
          if-no-files-found: error

      - name: Start SSR app for structural smoke tests
        run: docker compose up -d web

      # IMPORTANT: `dotnet run` compiles the app on first start, so readiness takes minutes
      # here, not the seconds the default 30 attempts allow.
      - name: Verify public route shells without production data
        run: docker compose exec -T -e ROUTE_SHELL_READY_ATTEMPTS=600 web sh tools/scripts/verify-route-shell.sh

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 web

  postgres-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run the compose services as the runner user
        run: |
          echo "PORTFOLIO_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Create isolated CI content placeholder
        run: >-
          docker run --rm --network none
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/src"
          --workdir /src
          mcr.microsoft.com/dotnet/sdk@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80
          sh -lc 'mkdir -p data/public && : > data/portfolio.sqlite'

      - name: Start PostgreSQL
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml up -d --wait postgres

      - name: Restore locked NuGet dependencies
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml run --rm web dotnet restore src/Portfolio.Blazor.slnx --locked-mode

      - name: Build Blazor solution
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml run --rm web dotnet build src/Portfolio.Blazor.slnx --configuration Release --no-restore

      - name: Apply PostgreSQL migrations
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml run --rm web sh -lc 'dotnet tool restore >/dev/null && dotnet tool run dotnet-ef database update --project src/Portfolio/Portfolio.Blazor.Database.Postgres/Portfolio.Blazor.Database.Postgres.csproj --startup-project src/Portfolio/Portfolio.Blazor.Database.Postgres/Portfolio.Blazor.Database.Postgres.csproj --context PortfolioAdminDbContext --configuration Release --no-build'

      - name: Compare the public snapshot across SQLite and PostgreSQL
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml run --rm web dotnet run --project src/Portfolio/Portfolio.Blazor.Data.Tests/Portfolio.Blazor.Data.Tests.csproj --configuration Release --no-build

      - name: Start SSR app on PostgreSQL
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml up -d web

      - name: Verify public route shells on PostgreSQL
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml exec -T -e ROUTE_SHELL_READY_ATTEMPTS=600 web sh tools/scripts/verify-route-shell.sh

      - name: Dump app logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.postgres.yaml logs --no-color --tail=200 web postgres
