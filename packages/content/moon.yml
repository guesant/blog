$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
layer: library
tags: [content]
toolchains:
  default: node

tasks:
  test:
    command: 'node --test test/**/*.test.ts'
    env:
      PORTFOLIO_CONTENT_ROOT: 'test/fixtures/content/cms'
    inputs: ['src/**/*', 'test/**/*', 'package.json', 'tsconfig.json']
    tags: [test, check]
