no_progress = true
cache = true
max_cache_age = "1d"
cache_exclude_status = "429,500.."
max_redirects = 5
max_retries = 3
max_concurrency = 32
host_concurrency = 4
retry_wait_time = 2
timeout = 20
accept = ["200..=299", "403", "429"]
insecure = false
min_tls = "TLSv1_2"
exclude_all_private = true
exclude_path = [
  "tools/checks/lychee\\.toml",
]
exclude = [
  # `https://x-access-token:${TOKEN}@github.com/...` git push URL templates in workflow
  # scripts. The shell variable interpolation isn't a real link; lychee's extractor
  # truncates it at the unresolved `${...}` password segment.
  "^https://x-access-token",
  # Seed content ships fictional references. Placeholders on reserved domains
  # (example.com) lychee already skips, but a made-up video id on a real domain
  # resolves to a genuine 404. Only the `example-` prefix is excluded, so a real
  # id put here later is checked normally.
  "^https://www\\.youtube\\.com/watch\\?v=example-",
  # not navigable pages: the bare origin 404s.
  "^https://www\\.googletagmanager\\.com/?$",
  "^https://www\\.google-analytics\\.com/?$",
  # not navigable pages: the bare origin 404s.
  "^https://fonts\\.googleapis\\.com/?$",
  "^https://fonts\\.gstatic\\.com/?$",
  "^https://www\\.gnu\\.org/?$",
]
