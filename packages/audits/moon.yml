$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
layer: automation
tags: [audit, heavy]
dependsOn: [portfolio]
toolchains:
  default: node

tasks:
  install-browser:
    command: 'playwright install chromium'
    options:
      cache: false
    tags: [setup, heavy]
  audit:
    command: 'playwright test tests/ci'
    deps: ['portfolio:standalone', 'install-browser']
    inputs: ['tests/ci/**/*', 'playwright.config.ts', 'package.json', '/packages/next-app/scripts/ci/audited-routes.json']
    outputs: ['playwright-report/**/*', 'test-results/**/*']
    options:
      cache: false
    tags: [audit, heavy]
  lighthouse:
    script: 'rm -rf .lighthouseci && lhci autorun --config=.lighthouserc.js'
    deps: ['portfolio:standalone', 'install-browser', 'audit']
    inputs: ['.lighthouserc.js', 'tests/ci/**/*', '/packages/next-app/scripts/ci/audited-routes.json']
    outputs: ['.lighthouseci/**/*']
    options:
      cache: false
    tags: [audit, heavy]
  performance:
    command: 'playwright test --config=playwright.performance.config.ts'
    deps: ['portfolio:standalone', 'install-browser']
    inputs: ['tests/performance/**/*', 'playwright.performance.config.ts', 'package.json']
    outputs: ['performance-results/**/*']
    options:
      cache: false
    tags: [audit, heavy]
