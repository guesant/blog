id: no-destructured-object-parameters-tsx
language: Tsx
severity: error
message: Funções devem receber um identificador para objetos e desestruturá-lo dentro do corpo.

rule:
  all:
    - kind: required_parameter
    - has:
        kind: object_pattern
    - not:
        inside:
          kind: arguments
          stopBy: end
          inside:
            pattern: test($$$ARGS)
            stopBy: end
