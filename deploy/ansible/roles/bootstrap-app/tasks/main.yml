---
- name: Copy the app-of-apps Application and ImageUpdater manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../gitops/applications/"
    dest: /tmp/applications/
    mode: "0644"

- name: Apply the app-of-apps Application and ImageUpdater manifests
  ansible.builtin.command: k3s kubectl apply --server-side --force-conflicts -n argocd -f /tmp/applications/
  register: applications_apply
  changed_when: "'unchanged' not in applications_apply.stdout"
