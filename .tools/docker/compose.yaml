name: portfolio-tools

services:
  tools:
    build:
      context: ../..
      dockerfile: .tools/docker/Dockerfile
      target: tools
    image: portfolio-tools
    working_dir: /workspace
    user: "${PORTFOLIO_CONTAINER_UID:-1000}:${PORTFOLIO_CONTAINER_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../..:/workspace
    tmpfs:
      - /tmp:uid=${PORTFOLIO_CONTAINER_UID:-1000},gid=${PORTFOLIO_CONTAINER_GID:-1000},mode=1777
    environment:
      HOME: /tmp
    command: ["true"]

  ast-grep:
    build:
      context: ../..
      dockerfile: .tools/docker/Dockerfile
      target: ast-grep
    image: portfolio-tools-ast-grep
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro

  jscpd:
    build:
      context: ../..
      dockerfile: .tools/docker/Dockerfile
      target: jscpd
    image: portfolio-tools-jscpd
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro

  lizard:
